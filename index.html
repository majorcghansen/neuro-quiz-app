      <h4>Aristotle (skeptic)</h4>
      <ul>
        <li>Did not believe the brain controls behavior — pointed to headless chickens/insects still moving.</li>

      <h4>Galen (ancient Rome)</h4>
      <ul>
        <li>Physician to gladiators; noticed brain/head injuries changed behavior.</li>

      </ul>
      <h4>Fritz &amp; Hitzig (1870, Germany)</h4>

        <li>Electrically stimulated exposed dog brains. Back of brain → no response; middle region → contralateral movement.</li>
        <li>Conclusions: brain is electrically excitable, has regional specificity, results were replicable across species.</li>
      </ul>
      <h4>Bartholow &amp; Mary Rafferty (Cincinnati, 1874)</h4>
      <ul>
        <li>Replicated stimulation in a living, awake human via an exposed skull ulcer; she couldn't override triggered movement.</li>
        <li>She died days later; backlash contributed to the AMA banning non-consensual human experimentation.</li>
        <li>First real evidence electrical brain activity controls behavior in humans; confirmed continuity across species.</li>
      </ul>
      <h4>John Flynn (~1950s, cats)</h4>

        <li>Stimulated the hypothalamus: one site → affective defense (arched back, hissing); another → quiet biting attack (stalk/pounce, no vocalization).</li>
        <li>Showed stimulation can elicit complex, integrated, goal-directed behavior, not just muscle twitches.</li>
      </ul>
      <h4>Wilder Penfield (1950s–60s)</h4>
      <ul>
        <li>Worked with awake epilepsy patients (brain has no pain receptors). Back of brain → flashes of light; lateral → hearing sounds; midline → arm movement.</li>
        <li>Some stimulation evoked specific memories and emotions — information could be "read out" of the brain electrically.</li>

      <h4>Michael Gazzaniga — split-brain research</h4>

        <li>Right hemisphere (left visual field) processed faces; left hemisphere (right visual field) processed only contours.</li>

      <h4>Key terms &amp; modern tools</h4>
      <ul>
        <li><b>Contralateral</b> = opposite side; <b>ipsilateral</b> = same side.</li>

      <h4>Hodgkin &amp; Huxley (1950s, Nobel 1963)</h4>
      <ul>
        <li>Wanted to <i>measure</i> inherent electrical properties of neurons (not just stimulate).</li>
        <li>Model organism: the squid giant axon (~1mm diameter) — large, easy to place electrodes in/around; invertebrates use giant axons for speed since they lack substantial myelin.</li>

      <h4>Recording setup</h4>
      <ul>
        <li>Two electrodes (measure a difference), an amplifier, and an oscilloscope (voltage vs. time).</li>

      <h4>The four experiments</h4>
      <ul>
        <li>Both electrodes outside → baseline 0, confirms setup works.</li>
        <li>One inside, one outside, unstimulated → −70 mV = the <b>resting potential</b>.</li>
        <li>Stimulated axon → voltage spikes well above 0, dips slightly below −70 mV, then restabilizes = the <b>action potential</b>.</li>
      </ul>
      <h4>Equilibrium concepts</h4>
      <ul>
        <li><b>Diffusion</b>: molecules move high → low concentration. <b>Electrical equilibrium</b>: like charges repel, opposite attract; a "dead battery" = no more gradient.</li>
        <li>Selectively permeable membrane: system balances minimizing the chemical gradient AND the electrical gradient — not full concentration equality.</li>
      </ul>
      <h4>Ion distribution in the neuron</h4>
      <ul>
        <li>Large proteins stuck inside, mostly negatively charged. Na⁺ is more concentrated outside at rest; K⁺ is more concentrated inside; Cl⁻ is differentially distributed.</li>
      </ul>
      <h4>The sodium-potassium pump</h4>
      <ul>
        <li>Continuously active; each cycle pumps <b>3 Na⁺ out, 2 K⁺ in</b> → net removes positive charge → creates the negative resting potential.</li>
        <li>Powered by ATP → ADP. This pump is why the brain consumes so much energy.</li>

    title: "Lecture 4 — The Nernst Equation &amp; the Action Potential",
    html: `
      <h4>Ion distribution at rest (axoplasm = inside)</h4>
      <ul>
        <li>K⁺: high inside (~400), low outside (~10–20). Na⁺: low inside (~50), high outside (~440). Cl⁻: low inside, high outside.</li>
        <li>Na⁺ and K⁺ are actively pumped against their gradients; Cl⁻ moves relatively freely.</li>
      </ul>
      <h4>The Nernst Equation</h4>
      <ul>
        <li>V = ± constant × log(ion outside / ion inside) — predicts the voltage a freely moving ion would produce.</li>
        <li>Predicted values: Cl⁻ ≈ −69 mV (matches resting potential); Na⁺ ≈ +57 mV (matches AP peak); K⁺ ≈ −78 mV (matches hyperpolarization overshoot).</li>
      </ul>
      <h4>Reaching threshold &amp; voltage-gated channels</h4>
      <ul>
        <li>At about −55 mV the neuron crosses threshold → triggers the full, stereotyped action potential (not graded).</li>
        <li>Voltage-gated channels are ion-specific pores that open at specific voltage levels (different thresholds for Na⁺ vs K⁺ channels).</li>
      </ul>
      <h4>Sequence of the action potential</h4>
      <ul>
        <li>Threshold reached (~−55 mV) → voltage-gated Na⁺ channels open → Na⁺ influx = <b>depolarization</b>.</li>
        <li>Voltage-gated K⁺ channels open → K⁺ efflux = <b>repolarization</b>.</li>
        <li>Na⁺ channels close; K⁺ channels close slightly late → overshoot below resting potential = <b>hyperpolarization</b>.</li>
        <li>Na⁺/K⁺ pump gradually restores resting potential (−70 mV).</li>
      </ul>
      <h4>Refractory period &amp; the All-or-None Law</h4>
      <ul>
        <li>~2 ms window after an AP during which the neuron cannot fire again (channels resetting).</li>
        <li>Every action potential in a given neuron is identical in size/shape/speed — stronger stimuli produce more frequent firing or recruit more neurons, not a bigger spike.</li>

      <h4>Graded Potentials vs. Action Potentials</h4>
      <ul>
        <li>Graded: decremental (diminishes with distance), very fast, spreads passively in all directions.</li>
        <li>Action potential: all-or-none (constant), slower (~100 m/s max), travels in one direction only.</li>

      <h4>Propagation down the axon</h4>
      <ul>
        <li>Each AP triggers a graded potential in the next segment; if still above threshold there, it triggers a new AP ("regeneration").</li>
        <li>One-directional because the just-fired segment is hyperpolarized/refractory and can't immediately re-fire — signal only moves into "fresh" axon.</li>
      </ul>
      <h4>Myelination</h4>
      <ul>
        <li>CNS: oligodendrocytes myelinate axons. PNS: Schwann cells myelinate axons.</li>
        <li>Myelin blocks ion movement under the sheath (only graded potential there); <b>Nodes of Ranvier</b> are unmyelinated gaps where APs actually regenerate — this is <b>saltatory conduction</b>.</li>
        <li>Myelination is one of the last brain maturation processes (3rd trimester through 3rd decade of life); correlates with motor development and improved memory (hippocampus).</li>
        <li>Multiple sclerosis = demyelinating disease. CNS myelin generally cannot regenerate; PNS (Schwann cell) myelin sometimes can, especially in children.</li>
      </ul>
      <h4>Synaptic transmission (end of axon)</h4>
      <ul>
        <li>AP arrives at axon terminal → opens voltage-gated Ca²⁺ channels → Ca²⁺ influx triggers vesicles to dock.</li>
        <li><b>Exocytosis</b>: vesicles fuse with membrane, release neurotransmitter into the synapse (~10 nm wide).</li>
        <li>Neurotransmitters diffuse passively across the cleft — diffusion to postsynaptic receptors is nearly instantaneous.</li>
      </ul>
    `

      <h4>Synapse anatomy</h4>
      <ul>
        <li>Pre-synaptic cell (sends signal) → cleft (space) → post-synaptic cell (receives signal).</li>
        <li>Types by connection point: axosomatic, axodendritic (most common), axoaxonic, dendrodendritic.</li>
      </ul>
      <h4>Ligand-gated channels</h4>
      <ul>
        <li>Open when a ligand (e.g., neurotransmitter) binds — lock-and-key specificity between transmitter and receptor shape.</li>
      </ul>
      <h4>Postsynaptic responses — 3 outcomes</h4>
      <ul>
        <li><b>Depolarization (EPSP)</b>: e.g., Na⁺ influx → excitatory, moves cell closer to threshold.</li>
        <li><b>Flat/no change</b>: simultaneous Na⁺ in &amp; K⁺ out cancel out.</li>
        <li><b>Hyperpolarization (IPSP)</b>: K⁺ efflux or Cl⁻ influx → inhibitory, moves cell further from threshold.</li>
        <li>Presynaptic signaling is binary (all-or-none AP), but postsynaptic responses are graded/varied — massively increases information-processing complexity.</li>
      </ul>
      <h4>Ionotropic vs. Metabotropic receptors</h4>
      <ul>
        <li><b>Ionotropic</b>: neurotransmitter directly opens an ion channel — fast, short-lived.</li>
        <li><b>Metabotropic</b>: neurotransmitter triggers a second-messenger system inside the cell — slower onset, but long-lasting (ms to days); can alter gene transcription, relevant to learning/memory.</li>
      </ul>
      <h4>Major neurotransmitter classes</h4>
      <ul>
        <li><b>Acetylcholine</b> — neuromuscular junction; first neurotransmitter discovered.</li>
        <li><b>Monoamines</b> — serotonin; catecholamines (dopamine → norepinephrine → epinephrine).</li>
        <li><b>Amino acids</b> — glutamate (primary excitatory, EPSP via Na⁺ influx); GABA (primary inhibitory, IPSP via K⁺ efflux).</li>

        <li><b>Dale's Law</b>: each neuron releases one primary type of neurotransmitter (exception: some release multiple in a fixed, homogeneous ratio per vesicle).</li>

    title: "Lecture 7 — Postsynaptic Integration &amp; Summation",

      <h4>EPSPs vs. IPSPs</h4>
      <ul>
        <li><b>EPSP</b> (excitatory postsynaptic potential): e.g., Na⁺ influx → depolarizing, moves the cell closer to threshold.</li>
        <li><b>IPSP</b> (inhibitory postsynaptic potential): K⁺ efflux or Cl⁻ influx → hyperpolarizing, moves the cell further from threshold.</li>
      </ul>
      <h4>Temporal summation</h4>
      <ul>
        <li>Repeated firing from <b>one</b> presynaptic neuron, close together in time, sums before decaying back to baseline — like hearing several people speak at once (overlapping/blended) vs. one at a time (spread out, distinguishable).</li>
      </ul>
      <h4>Spatial summation</h4>
      <ul>
        <li>Multiple <b>different</b> presynaptic neurons firing near-simultaneously onto the same postsynaptic cell combine their effects — not limited by a single neuron's refractory period (~200 Hz max firing rate for one neuron), so spatial summation can recruit far more input in the same window.</li>
        <li>Worked example: glutamate (excitatory, opens Na⁺ channels → EPSP) and GABA (inhibitory, opens K⁺ channels → IPSP) acting on the same postsynaptic cell at the same time can cancel out to a flat line (no net change).</li>

      <ul>

      <ul>

        <li>Treatment challenge: dopamine cannot cross the <b>blood-brain barrier</b> (BBB, maintained by astrocytes), so <b>L-DOPA</b> (a precursor molecule that CAN cross the BBB) is given and converted to dopamine in the brain (dramatized in the film <i>Awakenings</i>). L-DOPA tolerance develops over time, requiring dose increases with worsening side effects. No cure exists since the death of substantia nigra neurons cannot be halted.</li>

      <h4>Huntington's disease (HD)</h4>
      <ul>
        <li>Near-opposite of Parkinson's: excessive/uncontrollable movement (<b>chorea</b>, e.g. "hemiballism" — throwing-like movements) rather than an inability to move.</li>

      </ul>

let fcOrder = flashcards.map((_, i) => i);
let fcIndex = 0;
let fcFlipped = false;

const fcCard = document.getElementById('fc-card');
const fcFront = document.getElementById('fc-front-text');
const fcBack = document.getElementById('fc-back-text');
const fcCounter = document.getElementById('fc-counter');
const fcPrevBtn = document.getElementById('fc-prev');
const fcNextBtn = document.getElementById('fc-next');

function renderFlashcard() {
  const card = flashcards[fcOrder[fcIndex]];
  fcFront.textContent = card.front;
  fcBack.textContent = card.back;
  fcCounter.textContent = `Card ${fcIndex + 1} / ${flashcards.length}`;
  fcCard.classList.remove('flipped');
  fcFlipped = false;
  fcPrevBtn.disabled = fcIndex === 0;
  fcNextBtn.disabled = fcIndex === flashcards.length - 1;
}

fcCard.addEventListener('click', () => {
  fcFlipped = !fcFlipped;
  fcCard.classList.toggle('flipped', fcFlipped);
});
document.getElementById('fc-flip').addEventListener('click', () => fcCard.click());
fcPrevBtn.addEventListener('click', () => { if (fcIndex > 0) { fcIndex--; renderFlashcard(); } });
fcNextBtn.addEventListener('click', () => { if (fcIndex < flashcards.length - 1) { fcIndex++; renderFlashcard(); } });
document.getElementById('shuffle-btn').addEventListener('click', () => {
  for (let i = fcOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fcOrder[i], fcOrder[j]] = [fcOrder[j], fcOrder[i]];
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

    options: { a: "It doesn't involve neurotransmitters", b: "It combines input from multiple different presynaptic neurons, not repeated firing from one", c: "It only occurs at the axon hillock", d: "It happens too fast to be limited", e: "none of these" }, correct: "b",
    explanation: "Spatial summation pools input from many different presynaptic cells firing near-simultaneously, sidestepping any single neuron's firing-rate ceiling." },
  { q: "Why do synapses located closer to the axon hillock have more influence on whether a neuron fires?",
    options: { a: "They release more neurotransmitter per vesicle", b: "Graded potentials decay/decrement with distance, so distal inputs may never reach the hillock", c: "They are always excitatory", d: "They are myelinated while distal synapses are not", e: "none of these" }, correct: "b",
    explanation: "Because graded potentials weaken as they travel, proximal synapses (near the hillock) exert disproportionate influence over distal ones." },
  { q: "Demyelination can impair postsynaptic integration mainly by:",
    options: { a: "increasing neurotransmitter release", b: "causing signals to arrive too late to summate together", c: "blocking all ionotropic receptors", d: "increasing axon caliber", e: "none of these" }, correct: "b",
    explanation: "Myelin loss slows conduction, so inputs that should arrive together for summation can instead arrive out of sync." },
  { q: "The synaptic cleft is approximately:",
    options: { a: "20–50 nanometers wide", b: "20–50 micrometers wide", c: "1–2 millimeters wide", d: "the same width as a neuron's soma", e: "none of these" }, correct: "a",
    explanation: "The synaptic cleft is a very narrow gap, roughly 20–50 nanometers across." },
  { q: "Compared to ionotropic receptors, metabotropic (G-protein coupled) receptors:",
    options: { a: "open ion channels directly with no delay", b: "act on a much slower time scale and can involve second-messenger cascades", c: "are only found in muscle tissue", d: "cannot affect gene expression", e: "none of these" }, correct: "b",
    explanation: "Metabotropic receptors work through G-proteins/second messengers, producing effects that unfold more slowly than the direct pore-opening of ionotropic receptors." },
  { q: "Myasthenia Gravis is caused by:",
    options: { a: "loss of dopaminergic neurons in the substantia nigra", b: "death of medium spiny neurons in the striatum", c: "the immune system attacking postsynaptic ACh receptors at the neuromuscular junction", d: "a genetic mutation causing excess GABA release", e: "none of these" }, correct: "c",
    explanation: "Myasthenia Gravis is autoimmune: antibodies attack postsynaptic acetylcholine receptors, most severely at the neuromuscular junction." },
  { q: "Parkinson's disease results from the degeneration of dopaminergic neurons in the:",
    options: { a: "hippocampus", b: "substantia nigra", c: "cerebellum", d: "neuromuscular junction", e: "none of these" }, correct: "b",
    explanation: "Parkinson's is caused by loss of dopamine-producing neurons in the substantia nigra, part of the basal ganglia." },
  { q: "L-DOPA is used to treat Parkinson's disease instead of dopamine itself because:",
    options: { a: "L-DOPA is more potent than dopamine", b: "dopamine cannot cross the blood-brain barrier, but L-DOPA can", c: "L-DOPA has no side effects", d: "dopamine causes seizures", e: "none of these" }, correct: "b",
    explanation: "Dopamine can't cross the BBB, so the precursor L-DOPA is given instead and converted to dopamine once inside the brain." },
  { q: "A resting tremor, as seen in Parkinson's disease, is best described as a tremor that occurs:",
    options: { a: "only during voluntary movement", b: "when the affected body part is at rest, not moving", c: "only during sleep", d: "only after exercise", e: "none of these" }, correct: "b",
    explanation: "Resting tremor appears when the limb is at rest, distinguishing it from intention tremor (which occurs during movement)." },
  { q: "Huntington's disease is caused by the death of which neurons, and what type of movement results?",
    options: { a: "dopaminergic neurons in the substantia nigra; results in an inability to move", b: "medium spiny (GABAergic) neurons in the striatum; results in excessive/uncontrollable movement (chorea)", c: "postsynaptic ACh receptors at the neuromuscular junction; results in muscle weakness", d: "cerebellar Purkinje cells; results in loss of balance only", e: "none of these" }, correct: "b",
    explanation: "Huntington's involves death of inhibitory medium spiny neurons in the striatum, removing inhibition and causing chorea (excess movement) — the opposite pattern from Parkinson's." },
  { q: "Huntington's disease is inherited in what pattern, and why does this make it hard to select against?",
    options: { a: "Autosomal recessive; carriers show no symptoms at all", b: "Autosomal dominant; symptoms typically don't appear until midlife, after reproductive decisions are made", c: "X-linked; only affects males", d: "It is not genetic", e: "none of these" }, correct: "b",
    explanation: "HD is autosomal dominant (50/50 inheritance chance from an affected parent), but its late onset means it usually isn't caught before people have already had children." },
  { q: "Botulinum toxin (Botox) and black widow spider venom have opposite effects on the cholinergic synapse because:",
    options: { a: "Botox blocks ACh release (flaccid paralysis); black widow venom promotes ACh release (rigid paralysis)", b: "Botox promotes ACh release; black widow venom blocks it", c: "both block ACh receptors identically", d: "neither affects ACh release", e: "none of these" }, correct: "a",
    explanation: "Botox blocks presynaptic ACh release causing flaccid paralysis, while black widow venom over-stimulates release causing rigid paralysis." },
  { q: "Nicotine and muscarine were useful research tools because they let scientists:",
    options: { a: "destroy ACh receptors permanently", b: "selectively activate ionotropic (nicotine) vs. metabotropic (muscarine) ACh receptors separately", c: "block acetylcholinesterase", d: "increase ACh synthesis", e: "none of these" }, correct: "b",
    explanation: "Since endogenous ACh normally activates both receptor types at once, nicotine and muscarine let researchers isolate ionotropic vs. metabotropic effects individually." },
  { q: "Blocking acetylcholinesterase would be expected to:",
    options: { a: "prevent ACh synthesis", b: "prolong/strengthen ACh signaling by keeping it in the cleft longer", c: "immediately destroy the postsynaptic receptors", d: "have no effect on signaling", e: "none of these" }, correct: "b",
    explanation: "Acetylcholinesterase normally breaks down ACh; blocking it leaves more ACh in the cleft to keep stimulating the postsynaptic cell." },
  { q: "SSRIs like Prozac work by:",
    options: { a: "blocking dopamine receptors", b: "selectively blocking the serotonin reuptake transporter, prolonging serotonin's presence in the cleft", c: "increasing GABA release", d: "blocking serotonin synthesis", e: "none of these" }, correct: "b",
    explanation: "SSRIs (selective serotonin reuptake inhibitors) block the transporter that normally clears serotonin from the synapse, amplifying its signaling." },
  { q: "Typical (e.g., Haldol) vs. atypical (e.g., Risperdal) antipsychotics differ mainly in that:",
    options: { a: "typical antipsychotics mainly block dopamine; atypical ones work more on serotonin", b: "typical antipsychotics work only on GABA", c: "atypical antipsychotics increase dopamine", d: "there is no meaningful difference", e: "none of these" }, correct: "a",
    explanation: "Typical antipsychotics primarily decrease dopamine signaling, while atypical antipsychotics act more on serotonin systems." }
];

let selectedAnswers = {};
const quizEl = document.getElementById('quiz-questions');
const progressFill = document.getElementById('progress-fill');

function renderQuiz() {
  quizEl.innerHTML = '';
  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `
      <div class="q-number">Question ${idx + 1}</div>
      <div class="q-text">${item.q}</div>
      <div class="options" data-idx="${idx}">
        ${Object.entries(item.options).map(([key, val]) => `
          <label data-key="${key}">
            <input type="radio" name="q${idx}" value="${key}">
            ${key}. ${val}
          </label>
        `).join('')}
      </div>
      <div class="explanation" id="exp-${idx}">${item.explanation}</div>
    `;
    quizEl.appendChild(card);
  });
  quizEl.addEventListener('change', (e) => {
    if (e.target.type === 'radio') {
      const idx = e.target.name.replace('q', '');
      selectedAnswers[idx] = e.target.value;
      updateProgress();
    }
  });
}

function updateProgress() {
  const answered = Object.keys(selectedAnswers).length;
  progressFill.style.width = (answered / questions.length * 100) + '%';
}

document.getElementById('submit-btn').addEventListener('click', () => {
  let score = 0;
  questions.forEach((item, idx) => {
    const optionsDiv = document.querySelector(`.options[data-idx="${idx}"]`);
    const labels = optionsDiv.querySelectorAll('label');
    const chosen = selectedAnswers[idx];
    labels.forEach(label => {
      const key = label.dataset.key;
      label.querySelector('input').disabled = true;
      if (key === item.correct) label.classList.add('correct');
      else if (key === chosen && chosen !== item.correct) label.classList.add('incorrect');
    });
    document.getElementById(`exp-${idx}`).classList.add('show');
    if (chosen === item.correct) score++;
  });

  const total = questions.length;
  document.getElementById('score-num').textContent = `${score} / ${total}`;
  const pct = Math.round(score / total * 100);
  let msg = '';
  if (pct >= 90) msg = 'Excellent work!';
  else if (pct >= 75) msg = 'Solid grasp of the material.';
  else if (pct >= 60) msg = 'Good start — review the missed topics.';
  else msg = 'Review the lecture notes and try again.';
  document.getElementById('score-msg').textContent = `${pct}% — ${msg}`;
  document.getElementById('result').style.display = 'block';
  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('quiz').scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('retry-btn').addEventListener('click', () => {
  selectedAnswers = {};
  document.getElementById('result').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'block';
  progressFill.style.width = '0%';
  renderQuiz();
});

renderQuiz();
</script>
